<!doctype html>
<!--
  Stand-in for a Home Assistant dashboard, used to record images/ without a running
  HA. It stubs the two HA elements the card renders into, sets the theme variables
  the card reads, and drives it with a scripted fake hass. capture.py loads it in
  headless Chromium; opening it in a browser works too (the demo loops).
-->
<meta charset="utf-8">
<title>Decent DE1 card demo</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700&display=block">
<style>
  /* Home Assistant's default themes, the variables the card actually reads */
  :root, :root[data-theme="dark"] {
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --card-background-color: #1c1c1c;
    --ha-card-background: #1c1c1c;
    --divider-color: rgba(225,225,225,.12);
    --page-background: #111111;
  }
  :root[data-theme="light"] {
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --card-background-color: #fff;
    --ha-card-background: #fff;
    --divider-color: rgba(0,0,0,.12);
    --page-background: #f2f4f7;
  }
  :root {
    --error-color: #db4437;
    --warning-color: #ffa600;
    --ha-font-family-body: Roboto, sans-serif;
    --mdc-icon-size: 24px;
  }
  html, body { margin: 0; height: 100%; background: var(--page-background); }
  body { padding: 12px; box-sizing: border-box; font-family: Roboto, sans-serif; }
  decent-de1-card { display: block; height: 100%; }
  /* ?fit lets the card be as tall as its content instead of filling the viewport;
     capture.py then shrinks the viewport to match, for a still with no dead space */
  html.fit, html.fit body, html.fit decent-de1-card { height: auto; }
</style>
<script>
  // Icon paths from @mdi/js (Material Design Icons, Apache-2.0).
  const ICONS = {
    'mdi:coffee-outline': 'M2,21V19H20V21H2M20,8V5H18V8H20M20,3A2,2 0 0,1 22,5V8A2,2 0 0,1 20,10H18V13A4,4 0 0,1 14,17H8A4,4 0 0,1 4,13V3H20M16,5H6V13A2,2 0 0,0 8,15H14A2,2 0 0,0 16,13V5Z',
    'mdi:spray-bottle': 'M16.72 10.43C14.68 8.39 14.5 4.66 14.5 4H13V6H9V4H7C7 2.9 7.9 2 9 2H16V3C16 3.08 16.04 7.63 17.78 9.37L16.72 10.43M17 2V4H18V2H17M15 12C13 10 13 7 13 7H9V9C9 10 9 10 8 11S7 13 7 13V20C7 21.1 7.9 22 9 22H13C14.1 22 15 21.1 15 20V12Z',
    'mdi:calendar-refresh': 'M19 3H18V1H16V3H8V1H6V3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H14C13.4 20.5 12.9 19.8 12.5 19H5V8H19V10.6C19.7 10.7 20.4 10.9 21 11.3V5C21 3.9 20.1 3 19 3M18 12.5C19.1 12.5 20.1 12.9 20.8 13.7L22 12.5V16.5H18L19.8 14.7C19.3 14.3 18.7 14 18 14C16.6 14 15.5 15.1 15.5 16.5S16.6 19 18 19C18.8 19 19.5 18.6 20 18H21.7C21.1 19.5 19.7 20.5 18 20.5C15.8 20.5 14 18.7 14 16.5S15.8 12.5 18 12.5Z',
    'mdi:water-opacity': 'M16 14V12H17.61C17.85 12.71 18 13.39 18 14H16M15.58 8C15.12 7.29 14.65 6.61 14.2 6H14V8H15.58M16 12V10H14V12H16M16 8.68V10H16.74C16.5 9.56 16.26 9.11 16 8.68M12 16V14H14V12H12V10H14V8H12V6H14V5.73C12.9 4.26 12 3.25 12 3.25S6 10 6 14C6 17.31 8.69 20 12 20V18H14V16H12M14 19.65C14.75 19.39 15.42 19 16 18.46V18H14V19.65M14 16H16V14H14V16M16 18H16.46C17 17.42 17.39 16.75 17.65 16H16V18Z'
  };
  customElements.define('ha-card', class extends HTMLElement {
    connectedCallback() {
      this.style.cssText = 'display:block;height:100%;box-sizing:border-box;border-radius:12px;' +
        'background:var(--ha-card-background);color:var(--primary-text-color);' +
        'box-shadow:0 1px 3px rgba(0,0,0,.2);overflow:hidden';
    }
  });
  customElements.define('ha-icon', class extends HTMLElement {
    connectedCallback() {
      const size = getComputedStyle(this).getPropertyValue('--mdc-icon-size') || '24px';
      this.style.cssText = `display:inline-flex;width:${size};height:${size}`;
      this.innerHTML = `<svg viewBox="0 0 24 24" style="width:100%;height:100%;fill:currentColor">` +
        `<path d="${ICONS[this.getAttribute('icon')] || ''}"/></svg>`;
    }
  });
  const params = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = params.get('theme') === 'light' ? 'light' : 'dark';
  if (params.has('fit')) document.documentElement.classList.add('fit');
</script>
<script src="../dist/decent-de1-card.js"></script>
<decent-de1-card id="card"></decent-de1-card>
<script>
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const now = Date.now();
const iso = (ms) => new Date(ms).toISOString();
// input_datetime entities carry local time without an offset
const local = (ms) => new Date(ms - new Date().getTimezoneOffset() * MIN).toISOString().slice(0, 19).replace('T', ' ');

const card = document.getElementById('card');
card.setConfig({
  prefix: 'decent_de1_',
  shots_today: 'sensor.shots_today', shots_week: 'sensor.shots_week',
  shots_month: 'sensor.shots_month', shots_total: 'sensor.shots_total',
  last_shot: 'input_datetime.last_shot', last_cleaning: 'input_datetime.last_cleaning',
  cleaning_due: 'sensor.cleaning_due', descale_due: 'sensor.descale_due',
});

let tick = 0;
function push(s) {
  tick++;  // the card skips the update unless last_updated moved
  const st = (id, state, attrs) => [id, { state: String(state), attributes: attrs || {}, last_updated: iso(now + tick) }];
  card.hass = {
    states: Object.fromEntries([
      st('sensor.decent_de1_machine_state', s.state),
      st('sensor.decent_de1_machine_substate', s.sub),
      st('sensor.decent_de1_group_temperature', s.temp.toFixed(1), { unit_of_measurement: '°C' }),
      st('sensor.decent_de1_water_level', Math.round(s.water), { unit_of_measurement: '%' }),
      st('sensor.decent_de1_profile', s.profile),
      st('binary_sensor.decent_de1_shot_running', s.pouring ? 'on' : 'off'),
      st('sensor.shots_today', s.shots), st('sensor.shots_week', 10),
      st('sensor.shots_month', 26), st('sensor.shots_total', 1746),
      st('input_datetime.last_shot', local(now - s.lastShot)),
      st('input_datetime.last_cleaning', local(now - 4 * HOUR)),
      st('sensor.cleaning_due', local(now + 7 * DAY)),
      st('sensor.descale_due', local(now + 62 * DAY)),
    ]),
  };
}

const lerp = (a, b, u) => a + (b - a) * Math.max(0, Math.min(1, u));
const ease = (u) => (u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u));
const DURATION = 15200;

// The story: asleep, wake and heat, pull a shot, then run the tank down and refill.
// It ends where it started, so the GIF loops.
function frameAt(t) {
  // Real sensors report in steps; a value that moved every frame would redraw the
  // big digits twelve times a second, which the GIF pays for.
  const q = (ms) => Math.round(t / ms) * ms;
  const s = { state: 'Sleep', sub: 'ready', temp: 22, water: 100, profile: 'Gentle & Sweet', pouring: false, shots: 2, lastShot: 3 * HOUR };
  if (t >= 1300) { s.state = 'Idle'; s.sub = 'heating'; s.temp = lerp(22, 93, ease((t - 1300) / 2900)); }
  if (t >= 4300) { s.state = 'Idle'; s.sub = 'ready'; s.temp = 93 - 0.2 * Math.sin(q(900) / 700); }
  if (t >= 5200 && t < 7600) {
    s.state = 'Espresso'; s.sub = 'pouring'; s.pouring = true;
    s.temp = 92.7 - 0.3 * Math.sin((q(600) - 5200) / 400);
    s.water = lerp(100, 93, (t - 5200) / 2400);
  }
  if (t >= 7600) { s.state = 'Idle'; s.sub = 'ready'; s.water = 93; s.shots = 3; s.lastShot = 30 * 1000; }
  if (t >= 8400) s.water = lerp(93, 6, ease((t - 8400) / 3600));   // the tank runs down
  if (t >= 12300) s.water = lerp(6, 100, ease((t - 12300) / 1500)); // and is refilled
  if (t >= 14100) { s.state = 'Sleep'; s.sub = 'ready'; s.temp = lerp(93, 22, (t - 14100) / 900); s.water = 100; }
  return s;
}

// capture.py's hooks: freeze one set of values, or play the loop.
window.showState = (overrides) => push({ ...frameAt(0), ...overrides });
window.startDemo = () => {
  let t0 = null;
  const loop = (ts) => {
    if (t0 === null) t0 = ts;
    push(frameAt(Math.min(DURATION, ts - t0)));
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
};
push(frameAt(0));
// fonts, then a beat for the first water layer to decode and fade in
window.demoReady = document.fonts.ready.then(() => new Promise((r) => setTimeout(r, 600)));
if (!params.has('still')) window.demoReady.then(window.startDemo);
</script>
